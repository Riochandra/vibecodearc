<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoLens — Live Market Data</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2300e5a0'/><text x='16' y='22' font-size='18' font-weight='bold' font-family='monospace' text-anchor='middle' fill='%23000'>₿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080b10;
    --surface: #0d1117;
    --surface2: #161c25;
    --border: #1e2733;
    --accent: #00e5a0;
    --accent2: #0095ff;
    --red: #ff4d6a;
    --green: #00e5a0;
    --text: #e8edf5;
    --muted: #566475;
    --muted2: #8a9ab0;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(8,11,16,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    color: #000;
  }

  .logo-text {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .logo-text span { color: var(--accent); }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted2);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,229,160,0.4); }
    50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(0,229,160,0); }
  }

  .refresh-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted2);
    padding: 7px 14px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.5px;
  }

  .refresh-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Stats bar */
  .stats-bar {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 28px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .stats-bar::-webkit-scrollbar { display: none; }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    font-size: 12px;
  }

  .stat-label {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .stat-value {
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
  }

  /* Search & Controls */
  .controls {
    padding: 20px 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 320px;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px 9px 36px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }

  .per-page-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--muted2);
    font-family: var(--mono);
    font-size: 11px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .per-page-select:focus { border-color: var(--accent); }

  .results-count {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
    margin-left: auto;
  }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
  }

  thead tr {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  th {
    padding: 12px 16px;
    text-align: right;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s;
  }

  th:hover { color: var(--accent); }
  th:first-child, th:nth-child(2) { text-align: left; }
  th.sorted { color: var(--accent); }

  th .sort-arrow {
    display: inline-block;
    margin-left: 4px;
    opacity: 0.4;
    font-size: 9px;
  }
  th.sorted .sort-arrow { opacity: 1; }

  tbody tr {
    border-bottom: 1px solid rgba(30,39,51,0.6);
    transition: background 0.15s;
    animation: rowIn 0.3s ease both;
  }

  @keyframes rowIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  tbody tr:hover { background: rgba(22,28,37,0.8); }
  tbody tr:last-child { border-bottom: none; }

  td {
    padding: 13px 16px;
    text-align: right;
    font-size: 13px;
    white-space: nowrap;
  }

  td:first-child { text-align: left; width: 52px; }
  td:nth-child(2) { text-align: left; }

  .rank {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    width: 36px;
    text-align: center;
  }

  .coin-cell {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .coin-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface2);
    flex-shrink: 0;
  }

  .coin-icon-placeholder {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted2);
    flex-shrink: 0;
  }

  .coin-name-wrap { display: flex; flex-direction: column; gap: 2px; }

  .coin-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
  }

  .coin-symbol {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .price {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }

  .change {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }

  .change.up { color: var(--green); }
  .change.down { color: var(--red); }

  .mcap, .fdv, .vol {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted2);
  }

  .vol-bar-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .vol-pct {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent2);
  }

  .mini-bar {
    width: 60px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  .website-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
    transition: all 0.15s;
  }

  .website-link:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,229,160,0.08);
  }

  /* Loading */
  .loading-overlay {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    gap: 16px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1px;
  }

  .loader {
    width: 36px;
    height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* Error */
  .error-msg {
    padding: 40px 20px;
    text-align: center;
    color: var(--red);
    font-family: var(--mono);
    font-size: 13px;
  }

  /* Pagination */
  .pagination {
    padding: 20px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .page-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted2);
    padding: 7px 12px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .page-btn:hover { border-color: var(--accent); color: var(--accent); }
  .page-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,229,160,0.08); }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Footer */
  footer {
    padding: 24px 0;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 0.5px;
  }

  footer a { color: var(--muted2); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  /* Responsive */
  @media (max-width: 640px) {
    .stats-bar { gap: 16px; }
    .results-count { display: none; }
    th, td { padding: 10px 10px; }
    .mini-bar { width: 40px; }
  }
</style>
</head>
<body>
<header>
  <div class="container">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-mark">₿</div>
        <div class="logo-text">Crypto<span>Lens</span></div>
      </div>
      <div class="header-meta">
        <div class="live-badge">
          <div class="live-dot"></div>
          Live Data
        </div>
        <button class="refresh-btn" id="refreshBtn" onclick="loadData()">
          <svg id="refreshIcon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          REFRESH
        </button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="stats-bar" id="statsBar">
    <div class="stat-item"><span class="stat-label">Global MCap</span><span class="stat-value" id="globalMcap">—</span></div>
    <div class="stat-item"><span class="stat-label">24h Vol</span><span class="stat-value" id="globalVol">—</span></div>
    <div class="stat-item"><span class="stat-label">BTC Dom</span><span class="stat-value" id="btcDom">—</span></div>
    <div class="stat-item"><span class="stat-label">ETH Dom</span><span class="stat-value" id="ethDom">—</span></div>
    <div class="stat-item"><span class="stat-label">Active Coins</span><span class="stat-value" id="activeCoins">—</span></div>
    <div class="stat-item"><span class="stat-label">Last Updated</span><span class="stat-value" id="lastUpdated">—</span></div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search coins..." oninput="filterCoins()">
    </div>
    <select class="per-page-select" id="perPage" onchange="changePerPage()">
      <option value="25">25 / page</option>
      <option value="50" selected>50 / page</option>
      <option value="100">100 / page</option>
    </select>
    <div class="results-count" id="resultsCount"></div>
  </div>

  <div class="table-wrap">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader"></div>
      FETCHING MARKET DATA...
    </div>
    <div id="errorMsg" class="error-msg" style="display:none"></div>
    <table id="cryptoTable" style="display:none">
      <thead>
        <tr>
          <th onclick="sortBy('rank')" id="th-rank"># <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('name')" id="th-name">Name <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('price')" id="th-price">Price <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('change')" id="th-change">24h % <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('mcap')" id="th-mcap">Market Cap <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('fdv')" id="th-fdv">FDV <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('vol')" id="th-vol">Volume 24h <span class="sort-arrow">↕</span></th>
          <th onclick="sortBy('volpct')" id="th-volpct">Vol/MCap <span class="sort-arrow">↕</span></th>
          <th>Website</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<footer>
  <div class="container">
    Data sourced from <a href="https://www.coingecko.com" target="_blank">CoinGecko API</a> — refreshes every 60 seconds &nbsp;·&nbsp; CryptoLens
  </div>
</footer>

<script>
  let allCoins = [];
  let filtered = [];
  let sortKey = 'rank';
  let sortDir = 1;
  let currentPage = 1;
  let perPage = 50;
  let autoRefreshTimer;

  // Website URLs for top coins (CoinGecko doesn't return these in the list endpoint)
  const coinWebsites = {
    'bitcoin': 'https://bitcoin.org',
    'ethereum': 'https://ethereum.org',
    'tether': 'https://tether.to',
    'binancecoin': 'https://www.bnbchain.org',
    'solana': 'https://solana.com',
    'ripple': 'https://ripple.com',
    'usd-coin': 'https://www.circle.com/usdc',
    'dogecoin': 'https://dogecoin.com',
    'cardano': 'https://cardano.org',
    'avalanche-2': 'https://avax.network',
    'shiba-inu': 'https://shibatoken.com',
    'polkadot': 'https://polkadot.network',
    'chainlink': 'https://chain.link',
    'tron': 'https://tron.network',
    'polygon': 'https://polygon.technology',
    'toncoin': 'https://ton.org',
    'wrapped-bitcoin': 'https://wbtc.network',
    'dai': 'https://makerdao.com',
    'uniswap': 'https://uniswap.org',
    'litecoin': 'https://litecoin.org',
    'internet-computer': 'https://internetcomputer.org',
    'cosmos': 'https://cosmos.network',
    'ethereum-classic': 'https://ethereumclassic.org',
    'stellar': 'https://stellar.org',
    'monero': 'https://getmonero.org',
    'algorand': 'https://algorand.com',
    'filecoin': 'https://filecoin.io',
    'hedera-hashgraph': 'https://hedera.com',
    'aptos': 'https://aptoslabs.com',
    'arbitrum': 'https://arbitrum.io',
    'near': 'https://near.org',
    'optimism': 'https://optimism.io',
    'sui': 'https://sui.io',
    'stacks': 'https://stacks.co',
    'render-token': 'https://rendernetwork.com',
    'injective-protocol': 'https://injectiveprotocol.com',
    'immutable-x': 'https://immutable.com',
    'aave': 'https://aave.com',
    'maker': 'https://makerdao.com',
    'the-graph': 'https://thegraph.com',
    'okb': 'https://www.okx.com',
    'cronos': 'https://crypto.com/chain',
    'theta-token': 'https://thetatoken.org',
    'vechain': 'https://vechain.org',
    'fantom': 'https://fantom.foundation',
    'eos': 'https://eos.io',
    'thorchain': 'https://thorchain.org',
    'kucoin-shares': 'https://www.kucoin.com',
    'flow': 'https://flow.com',
    'decentraland': 'https://decentraland.org',
    'the-sandbox': 'https://sandbox.game',
    'axie-infinity': 'https://axieinfinity.com',
  };

  function fmt(n) {
    if (n == null) return '—';
    if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
    if (n >= 1e9)  return '$' + (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6)  return '$' + (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3)  return '$' + (n / 1e3).toFixed(2) + 'K';
    return '$' + n.toFixed(2);
  }

  function fmtPrice(n) {
    if (n == null) return '—';
    if (n >= 1000) return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    if (n >= 1)    return '$' + n.toFixed(4);
    if (n >= 0.01) return '$' + n.toFixed(5);
    if (n >= 0.0001) return '$' + n.toFixed(6);
    return '$' + n.toExponential(3);
  }

  function fmtGlobal(n) {
    if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
    if (n >= 1e9)  return '$' + (n/1e9).toFixed(2) + 'B';
    return '$' + n.toFixed(0);
  }

  async function loadGlobalData() {
    try {
      const res = await fetch('https://api.coingecko.com/api/v3/global');
      const d = await res.json();
      const g = d.data;
      document.getElementById('globalMcap').textContent = fmtGlobal(g.total_market_cap.usd);
      document.getElementById('globalVol').textContent = fmtGlobal(g.total_volume.usd);
      document.getElementById('btcDom').textContent = g.market_cap_percentage.btc.toFixed(1) + '%';
      document.getElementById('ethDom').textContent = g.market_cap_percentage.eth.toFixed(1) + '%';
      document.getElementById('activeCoins').textContent = g.active_cryptocurrencies.toLocaleString();
    } catch(e) {}
  }

  let searchDebounceTimer;
  let isSearchMode = false;

  async function safeJson(res) {
    const text = await res.text();
    if (!text || (text.trim()[0] !== '{' && text.trim()[0] !== '[')) {
      const hint = res.status === 429 ? 'Rate limited by CoinGecko — wait a few seconds and try again.'
                 : res.status === 403 ? 'Access denied by CoinGecko API.'
                 : `API returned status ${res.status}. Try again shortly.`;
      throw new Error(hint);
    }
    return JSON.parse(text);
  }

  async function loadData() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    btn.disabled = true;
    document.getElementById('errorMsg').style.display = 'none';

    try {
      const [r1, r2] = await Promise.all([
        fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false&price_change_percentage=24h'),
        fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=2&sparkline=false&price_change_percentage=24h')
      ]);

      const d1 = await safeJson(r1);
      const d2 = await safeJson(r2);
      allCoins = [...(Array.isArray(d1) ? d1 : []), ...(Array.isArray(d2) ? d2 : [])];

      document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
      document.getElementById('loadingOverlay').style.display = 'none';
      document.getElementById('cryptoTable').style.display = '';

      if (!isSearchMode) {
        filtered = [...allCoins];
        sortCoins();
        currentPage = 1;
        renderTable();
      }

      loadGlobalData();
    } catch(e) {
      document.getElementById('loadingOverlay').style.display = 'none';
      const em = document.getElementById('errorMsg');
      em.style.display = 'block';
      em.textContent = '⚠ Failed to fetch data. Check your connection or try again. (' + e.message + ')';
    }

    btn.classList.remove('spinning');
    btn.disabled = false;
    clearTimeout(autoRefreshTimer);
    autoRefreshTimer = setTimeout(loadData, 60000);
  }

  function filterCoins() {
    const q = document.getElementById('searchInput').value.trim();

    if (!q) {
      isSearchMode = false;
      filtered = [...allCoins];
      sortCoins();
      currentPage = 1;
      renderTable();
      return;
    }

    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => doSearch(q), 400);
  }

  async function doSearch(q) {
    isSearchMode = true;
    const tbody = document.getElementById('tableBody');
    document.getElementById('cryptoTable').style.display = '';
    document.getElementById('loadingOverlay').style.display = 'none';
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:1px;">
      <div style="display:inline-flex;align-items:center;gap:10px;"><div class="loader" style="width:18px;height:18px;border-width:2px"></div> SEARCHING FULL DATABASE...</div>
    </td></tr>`;
    document.getElementById('resultsCount').textContent = 'searching…';
    document.getElementById('pagination').innerHTML = '';

    try {
      // Step 1: full-database search by name/symbol
      const searchRes = await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(q)}`);
      const searchData = await safeJson(searchRes);
      const coins = searchData.coins || [];

      if (coins.length === 0) {
        filtered = [];
        renderTable();
        return;
      }

      // Step 2: fetch live market data for top 20 matched coin IDs
      const ids = coins.slice(0, 20).map(c => c.id).join(',');
      const marketRes = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${encodeURIComponent(ids)}&order=market_cap_desc&per_page=20&page=1&sparkline=false&price_change_percentage=24h`);
      const marketData = await safeJson(marketRes);

      filtered = Array.isArray(marketData) ? marketData : [];

      // Preserve CoinGecko's relevance ranking
      const idOrder = coins.map(c => c.id);
      filtered.sort((a, b) => idOrder.indexOf(a.id) - idOrder.indexOf(b.id));

      currentPage = 1;
      renderTable();
    } catch(e) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px 20px;font-family:var(--mono);font-size:12px;">
        <div style="color:var(--red);margin-bottom:8px;">⚠ ${e.message}</div>
        <div style="color:var(--muted);font-size:10px;">CoinGecko's free API has rate limits. Wait a moment and try again.</div>
      </td></tr>`;
      document.getElementById('resultsCount').textContent = '';
    }
  }

  function sortBy(key) {
    if (sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = 1; }
    document.querySelectorAll('th').forEach(t => t.classList.remove('sorted'));
    const th = document.getElementById('th-' + key);
    if (th) th.classList.add('sorted');
    sortCoins();
    renderTable();
  }

  function sortCoins() {
    const keyMap = {
      rank: c => c.market_cap_rank || 9999,
      name: c => c.name.toLowerCase(),
      price: c => c.current_price || 0,
      change: c => c.price_change_percentage_24h || 0,
      mcap: c => c.market_cap || 0,
      fdv: c => c.fully_diluted_valuation || 0,
      vol: c => c.total_volume || 0,
      volpct: c => (c.total_volume && c.market_cap) ? c.total_volume / c.market_cap : 0,
    };
    const fn = keyMap[sortKey] || (c => c.market_cap_rank);
    filtered.sort((a, b) => {
      const va = fn(a), vb = fn(b);
      return va < vb ? -sortDir : va > vb ? sortDir : 0;
    });
  }

  function changePerPage() {
    perPage = parseInt(document.getElementById('perPage').value);
    currentPage = 1;
    renderTable();
  }

  function renderTable() {
    const start = (currentPage - 1) * perPage;
    const page = filtered.slice(start, start + perPage);
    const tbody = document.getElementById('tableBody');

    document.getElementById('resultsCount').textContent =
      filtered.length + ' coins' + (allCoins.length !== filtered.length ? ' (filtered)' : '');

    if (page.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--muted);font-family:var(--mono);font-size:12px;">NO RESULTS FOUND</td></tr>';
    } else {
      tbody.innerHTML = page.map((c, i) => {
        const chg = c.price_change_percentage_24h;
        const chgClass = chg >= 0 ? 'up' : 'down';
        const chgArrow = chg >= 0 ? '▲' : '▼';
        const chgStr = chg != null ? `${chgArrow} ${Math.abs(chg).toFixed(2)}%` : '—';

        const volPct = (c.total_volume && c.market_cap) ? (c.total_volume / c.market_cap * 100) : null;
        const volPctStr = volPct != null ? volPct.toFixed(2) + '%' : '—';
        const barWidth = volPct != null ? Math.min(volPct * 2, 100) : 0;

        const website = coinWebsites[c.id];
        const linkEl = website
          ? `<a href="${website}" target="_blank" class="website-link" title="Official Website">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </a>`
          : `<a href="https://www.coingecko.com/en/coins/${c.id}" target="_blank" class="website-link" title="CoinGecko Page">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </a>`;

        const iconEl = c.image
          ? `<img class="coin-icon" src="${c.image}" alt="${c.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            + `<div class="coin-icon-placeholder" style="display:none">${c.symbol.slice(0,2).toUpperCase()}</div>`
          : `<div class="coin-icon-placeholder">${c.symbol.slice(0,2).toUpperCase()}</div>`;

        return `<tr style="animation-delay:${i * 0.02}s">
          <td><div class="rank">${c.market_cap_rank || '—'}</div></td>
          <td>
            <div class="coin-cell">
              ${iconEl}
              <div class="coin-name-wrap">
                <span class="coin-name">${c.name}</span>
                <span class="coin-symbol">${c.symbol}</span>
              </div>
            </div>
          </td>
          <td><span class="price">${fmtPrice(c.current_price)}</span></td>
          <td><span class="change ${chgClass}">${chgStr}</span></td>
          <td><span class="mcap">${fmt(c.market_cap)}</span></td>
          <td><span class="fdv">${fmt(c.fully_diluted_valuation)}</span></td>
          <td><span class="vol">${fmt(c.total_volume)}</span></td>
          <td>
            <div class="vol-bar-wrap">
              <span class="vol-pct">${volPctStr}</span>
              <div class="mini-bar"><div class="mini-bar-fill" style="width:${barWidth}%"></div></div>
            </div>
          </td>
          <td>${linkEl}</td>
        </tr>`;
      }).join('');
    }

    renderPagination();
  }

  function renderPagination() {
    const totalPages = Math.ceil(filtered.length / perPage);
    const pag = document.getElementById('pagination');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }

    let html = '';
    html += `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>← Prev</button>`;

    const range = [];
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage-2 && i <= currentPage+2)) {
        range.push(i);
      } else if (range[range.length-1] !== '…') {
        range.push('…');
      }
    }

    range.forEach(p => {
      if (p === '…') {
        html += `<button class="page-btn" disabled>…</button>`;
      } else {
        html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
      }
    });

    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next →</button>`;
    pag.innerHTML = html;
  }

  function goPage(p) {
    const totalPages = Math.ceil(filtered.length / perPage);
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderTable();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  // Init
  loadData();
</script>
</body>
</html>
